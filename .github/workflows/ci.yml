name: CI

on:
  push:
    branches: [main]
    # Documentation-only changes cannot affect the build or tests: no crate
    # embeds markdown via include_str!, and no test reads docs/.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE-*"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE-*"

env:
  CARGO_TERM_COLOR: always

# Supersede in-flight PR runs when new commits land; never cancel a main run,
# whose cache save later runs depend on.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: fmt + clippy + build/test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.0"
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown,wasm32-wasip2

      # Shared build/artifact caching (community convention; replaces hand-rolled actions/cache).
      # Only main writes the cache: PR runs restore it but skip the save step and
      # cannot evict main's entry.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Format
        run: cargo fmt --all -- --check

      - name: Resolve workspace graph
        # Proves the whole graph (incl. the public-fork rust-rule-engine patch) resolves.
        run: cargo metadata --format-version 1 > /dev/null

      # The Cargo workspace is pure Rust; the embedding engine is built as a
      # separate WASI component in release jobs.
      - name: Clippy (workspace)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build (workspace)
        run: >-
          cargo build --workspace
          --exclude vrules-mcp
          --exclude vrules-storage
          --exclude vrules-harness
          --exclude vrules-admin
          --exclude vrules-gcp

      - name: Build WASI components
        run: |
          cargo build --target wasm32-wasip2 \
            -p vrules-mcp \
            -p vrules-storage \
            -p vrules-harness \
            -p vrules-admin \
            -p vrules-gcp \
            -p vrules-cache

      - name: Test (cached real-embedding conformance)
        # The committed fixture contains real EmbeddingGemma vectors and is reseeded
        # through vrules-shim --daemon, so CI remains model-free without stubs.
        run: >-
          cargo test
          -p vrules-canon
          -p em-log-n
          -p em-log-n-wasm
          -p vrules-address-indexer
          -p vrules-core
          -p vrules-wasm
          -p vrules-shim
          -p vrules-cache

  wasm:
    name: browser wasm packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.0"
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Build wasm packages (web target)
        run: |
          wasm-pack build crates/vrules-wasm --target web --out-name vrules_wasm --release
          wasm-pack build crates/em-log-n-wasm --target web --out-name em_log_n_wasm --release

  deny:
    name: cargo-deny (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
